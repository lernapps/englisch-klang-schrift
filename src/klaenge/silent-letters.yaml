# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Buchstaben, die man nicht hört
description: "Sophie liest ein Wort mit einem k vor, das man nicht spricht. Du lernst stumme Buchstaben kennen und schreibst Wörter damit richtig."
competencies: [silent-letters]
scope: "Die Seite zeigt stumme Buchstaben: Buchstaben, die man schreibt, aber nicht spricht. In der Klangpartitur hat so ein Buchstabe keine blaue Karte, sondern eine graue gestrichelte. Gelernt werden die häufigsten Muster: k vor n (knife), w vor r (write), b nach m (climb), t in listen. Beispiele zum Üben sind andere Wörter (wrong, hour, walk, know, talk, answer, castle, two). Nicht hier, weil sie auf späteren Seiten stehen: Laute der Wörter in Lautschrift, Betonung."
blocks:
  - type: section
    id: einstieg
    title: Warum lacht Amir?
    blocks:
      - type: figure
        image: images/szene-silent-letters.svg
        alt: "Im Klassenzimmer steht eine Tafel mit drei Zeilen. Sophie sagt in einer Sprechblase „k-nee?“, Amir lacht und sagt „Ha ha!“. Mr Hill steht rechts unter der Tafel."
        caption: "Von links: Sophie (Zöpfe) liest ein Wort vor, Amir (Brille) lacht, rechts steht Mr Hill (graue Haare)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Sophie liest das englische Wort **knee** („Knie“) vor, genau so, wie es geschrieben steht: „k-nee“. Amir lacht."
      - type: single-choice
        id: silent-letters-start
        text: Warum lacht Amir?
        options:
          - text: Das k in knee spricht man nicht, es bleibt stumm.
            correct: true
            info: Im Wort knee hört man nur „nii“. Das k schreibt man, aber man spricht es nicht.
          - text: Das k in knee spricht man nur am Wortende nicht.
            correct: false
            info: Im Wort knee steht das k am Anfang, und man spricht es nicht. Stumme Buchstaben gibt es an vielen Stellen im Wort.
          - text: Das Wort knee schreibt man im Englischen ohne k.
            correct: false
            info: Man schreibt knee mit k. Man spricht es nur nicht.
        explanation: Im Englischen gibt es Buchstaben, die man schreibt, aber nicht spricht. Man nennt sie stumme Buchstaben.
        links:
          - title: Lernlandkarte Englisch · Stumme Buchstaben
            url: https://lernapps.net/apps/map/englisch/c/silent-letters/
      - type: text
        text: "**Das kannst du danach:** Du erkennst stumme Buchstaben, sprichst die Wörter richtig und schreibst sie richtig."
  - type: section
    id: neu
    title: Schreiben, aber nicht sprechen
    blocks:
      - type: text
        text: "Ein **stummer Buchstabe** steht im Wort, aber man spricht ihn nicht. In der Klangpartitur hat er keine blaue Karte, sondern eine graue gestrichelte. Der Buchstabe darunter ist grau."
      - type: figure
        image: images/partitur-silent-letters.svg
        alt: "Die Klangpartitur mit dem Wort knee. In der unteren Zeile steht eine graue gestrichelte Karte mit einem Strich unter dem grauen k, dann eine blaue Karte n unter n und eine blaue Karte iː unter ee."
        caption: "Das k hat keine Lautkarte. Man hört nur n und iː."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: "Klassenzimmer-Poster · Stumme Buchstaben"
        header: [Muster, Beispiel, Stumm]
        rows:
          - [k vor n, knife, k]
          - [w vor r, write, w]
          - [b nach m, climb, b]
          - [t in -sten, listen, t]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              - **Stumme Buchstaben schreibt man, aber man spricht sie nicht.**
              - Sie stehen oft in festen Mustern: kn-, wr-, -mb, -sten.
              - Man muss sie beim Schreiben lernen, denn das Wort klingt ohne sie.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: multiple-choice
        id: silent-letters-erkennen
        text: In welchen Wörtern gibt es einen stummen Buchstaben?
        options:
          - text: wrong
            correct: true
            info: "Das w vor r ist stumm: wrong klingt wie „rong“."
          - text: hour
            correct: true
            info: "Das h am Anfang ist stumm: hour klingt wie „auer“."
          - text: walk
            correct: true
            info: Das l ist stumm. Man spricht walk ohne l.
          - text: desk
            correct: false
            info: In desk spricht man jeden Buchstaben.
        explanation: Das w in wrong, das h in hour und das l in walk sind stumm. In desk spricht man jeden Buchstaben.
        links:
          - title: Lernlandkarte Englisch · Stumme Buchstaben
            url: https://lernapps.net/apps/map/englisch/c/silent-letters/
      - type: language-task
        id: silent-letters-schreiben
        languages: { source: de, target: en }
        task: Schreibe das englische Wort.
        form: { case: ok, punctuation: ok }
        items:
          - source: falsch
            target: wrong
            mistakes:
              - answer: rong
                message: Vor dem r steht ein stummes w.
          - source: wissen
            target: know
            mistakes:
              - answer: no
                message: No heißt „nein“. Wissen schreibt man mit stummem k.
              - answer: now
                message: Now heißt „jetzt“. Wissen schreibt man mit k am Anfang.
          - source: Stunde
            target: hour
            mistakes:
              - answer: our
                message: Our heißt „unser“. Stunde schreibt man mit stummem h.
          - source: sprechen
            target: talk
            mistakes:
              - answer: tok
                message: Zwischen a und k steht ein stummes l.
        hint: Denk an die Muster aus der Tabelle. Was fehlt am Anfang oder in der Mitte?
      - type: language-task
        id: silent-letters-hoeren
        languages: { source: de, target: en }
        task: Höre zu und schreibe jeden Satz ganz auf.
        form: { case: ok, punctuation: ok }
        items:
          - audio: ellie-talks-to-mr-hill-every-morning.mp3
            target: Ellie talks to Mr Hill every morning.
            mistakes:
              - answer: Ellie tocks to Mr Hill every morning.
                message: Zwischen a und k steht ein stummes l.
          - audio: peter-finds-the-answer-in-the-castle.mp3
            target: Peter finds the answer in the castle.
            mistakes:
              - answer: Peter finds the anser in the castle.
                message: Vor dem r in answer steht ein stummes w.
          - audio: sophie-asks-two-questions-today.mp3
            target: Sophie asks two questions today.
            mistakes:
              - answer: Sophie asks too questions today.
                message: Too heißt „auch“ oder „zu“. Die Zahl schreibt man mit stummem w, two.
        hint: Höre den Satz so oft, wie du willst. Schreibe jedes Wort auf, das du verstehst.
  - type: section
    id: anwenden
    title: Sprich nach
    blocks:
      - type: speaking-task
        id: silent-letters-nachsprechen
        language: en
        task: Höre den Satz und nimm dich auf. Höre dich an und bewerte dich selbst. Die App hört nicht zu.
        items:
          - audio: amir-listens-to-mrs-parker.mp3
            text: Amir listens to Mrs Parker.
          - audio: sophie-climbs-the-big-tree-with-ellie.mp3
            text: Sophie climbs the big tree with Ellie.
          - audio: mr-hill-writes-a-long-text-today.mp3
            text: Mr Hill writes a long text today.
        hint: Sprich die stummen Buchstaben nicht mit.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Mr Hill zeigt auf die Klangpartitur: „Jetzt kennt ihr die Zeichen und die Buchstaben, die man nicht hört.“ Auf den nächsten Seiten hängen die Kinder an Wörter Endungen an, und es zeigt sich, was dabei mit der Schreibung und mit dem Klang passiert."
