# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: th, w, v und r
description: "Sophie sagt Sank you, und Ellie wundert sich. Du lernst die Laute th, w, v und r richtig zu sprechen."
competencies: [konsonanten-th-w]
scope: "Die Seite zeigt vier Laute, die Kindern aus Deutschland oft schwerfallen: th (/θ/ in thank, /ð/ in the), w (/w/) gegen v (/v/) und das englische r (/r/). th: Die Zunge liegt zwischen den Zähnen. w: runde Lippen, kein Zahnkontakt. v: obere Zähne auf der Unterlippe. r: Zungenspitze nach hinten, nicht rollen. Zum Üben dienen andere Wörter (three, mother, window, village, wish, think, this). Nicht hier, weil sie auf anderen Seiten stehen: Vokale, Wortenden, stumme Buchstaben."
blocks:
  - type: section
    id: einstieg
    title: Sophie sagt Sank you
    blocks:
      - type: figure
        image: images/szene-konsonanten-th-w.svg
        alt: "Im Klassenzimmer sagt Sophie in einer Sprechblase „Sank you!“. Ellie schaut mit der Sprechblase „Eh?“ zu ihr. Mr Hill steht rechts."
        caption: "Von links: Sophie (Zöpfe), Ellie (roter Pferdeschwanz) und rechts Mr Hill (graue Haare)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Sophie bedankt sich bei Ellie: „Sank you!“ In Hello, Millbrook! hat sie „fenk ju“ gelernt. Das war eine Hilfe für den Anfang, aber nicht genau. Heute spricht Sophie das th wie ein s, und Ellie wundert sich."
      - type: single-choice
        id: konsonanten-start
        text: Wo liegt die Zunge bei dem th in thank?
        options:
          - text: Zwischen den Zähnen.
            correct: true
            info: Die Zungenspitze liegt leicht zwischen den oberen und unteren Zähnen. Die Luft strömt vorbei.
          - text: Hinter den oberen Zähnen, wie bei s.
            correct: false
            info: So klingt sank. Das ist ein s und kein th.
          - text: Die Unterlippe berührt die oberen Zähne.
            correct: false
            info: So klingt fank. Das ist ein f und kein th.
        explanation: Beim th liegt die Zunge zwischen den Zähnen. Es klingt weder wie s noch wie f.
        links:
          - title: Lernlandkarte Englisch · Konsonanten th, w, v, r
            url: https://lernapps.net/apps/map/englisch/c/konsonanten-th-w/
      - type: text
        text: "**Das kannst du danach:** Du sprichst th, w, v und r und unterscheidest sie von ähnlichen Lauten."
  - type: section
    id: neu
    title: Wo die Zunge und die Lippen liegen
    blocks:
      - type: text
        text: "Der Laut **th** hat zwei Formen: /θ/ in thank klingt hauchig, /ð/ in the summt. Beide sprichst du mit der Zunge zwischen den Zähnen."
      - type: figure
        image: images/zunge-th.svg
        alt: "Zwei Zeichnungen der Zunge im Mund von der Seite. Links liegt die Zungenspitze zwischen den oberen und unteren Zähnen, beschriftet mit th. Rechts liegt die Zungenspitze hinter den oberen Zähnen, beschriftet mit s."
        caption: "Links th: Die Zungenspitze liegt zwischen den Zähnen. Rechts s: Sie liegt dahinter."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: "Lautkarten · th, w, v und r"
        header: [Zeichen, Beispielwort, So sprichst du es]
        rows:
          - ["/θ/", thank, "Zunge zwischen den Zähnen, hauchig"]
          - ["/ð/", the, "Zunge zwischen den Zähnen, summend"]
          - ["/w/", west, "Lippen rund, kein Zahnkontakt"]
          - ["/v/", van, obere Zähne auf der Unterlippe]
          - ["/r/", red, "Zungenspitze nach hinten, nicht rollen"]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              - **th** klingt nicht wie s, f oder d.
              - **w** und **v** sind zwei verschiedene Laute: Bei w sind die Lippen rund, bei v berühren die Zähne die Lippe.
              - Das englische **r** rollst du nicht und sprichst es nicht hinten im Hals.
      - type: speaking-task
        id: konsonanten-karten
        language: en
        task: "Höre vier Sätze und sprich sie nach. In jedem steckt ein Wort aus der Tabelle: thank, the, west, red."
        items:
          - audio: they-thank-the-teacher-today.mp3
            text: They thank the teacher today.
          - audio: sophie-looks-at-the-blue-sky-again.mp3
            text: Sophie looks at the blue sky again.
          - audio: amir-lives-in-the-west-of-the-village.mp3
            text: Amir lives in the west of the village.
          - audio: peter-has-a-red-ball-upstairs.mp3
            text: Peter has a red ball upstairs.
        hint: Die Aufnahme ist eine KI-Stimme und spricht manchmal unscharf. Frag im Zweifel deine Lehrkraft.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: konsonanten-zuordnen
        text: Welches Zeichen steckt in welchem Wort?
        pairs:
          - left: "/θ/"
            right: three
          - left: "/ð/"
            right: mother
          - left: "/w/"
            right: window
          - left: "/v/"
            right: very
          - left: "/r/"
            right: rain
        explanation: Das th in three klingt hauchig, das th in mother summt.
        links:
          - title: Lernlandkarte Englisch · Konsonanten th, w, v, r
            url: https://lernapps.net/apps/map/englisch/c/konsonanten-th-w/
      - type: single-choice
        id: konsonanten-lesen
        text: Welches Wort steht in Lautschrift? /θriː/
        options:
          - text: three
            correct: true
            info: Das Zeichen /θ/ ist das th. Das Wort three heißt „drei“.
          - text: free
            correct: false
            info: Bei free beginnt das Wort mit f. Das ist ein anderer Laut als th.
          - text: tree
            correct: false
            info: Bei tree beginnt das Wort mit t. Das ist ein anderer Laut als th.
        explanation: Das Zeichen θ steht für th. Das Wort heißt three.
        links:
          - title: Lernlandkarte Englisch · Konsonanten th, w, v, r
            url: https://lernapps.net/apps/map/englisch/c/konsonanten-th-w/
      - type: single-choice
        id: konsonanten-w-v
        text: Welches Zeichen steht für den ersten Laut von village?
        options:
          - text: "/v/"
            correct: true
            info: Das v in village sprichst du mit den Zähnen auf der Unterlippe.
          - text: "/w/"
            correct: false
            info: Das w sprichst du mit runden Lippen. Das ist der Laut in west.
          - text: "/f/"
            correct: false
            info: Das v in Vater klingt wie f. Im Englischen ist v ein eigener, summender Laut.
        explanation: Das englische v summt und ist ein eigener Laut.
        links:
          - title: Lernlandkarte Englisch · Konsonanten th, w, v, r
            url: https://lernapps.net/apps/map/englisch/c/konsonanten-th-w/
      - type: language-task
        id: konsonanten-schreiben
        languages: { source: de, target: en }
        task: Schreibe das Wort, das in Lautschrift steht.
        form: { case: ok, punctuation: ok }
        items:
          - cue: "/θɪŋk/"
            target: think
            mistakes:
              - answer: sink
                message: Sink hat am Anfang ein s. Hier steht /θ/, geschrieben th.
          - cue: "/ðɪs/"
            target: this
            mistakes:
              - answer: dis
                message: Das Zeichen /ð/ schreibt man th, nicht d.
          - cue: "/wɪʃ/"
            target: wish
            mistakes:
              - answer: vish
                message: Das erste Zeichen ist /w/ mit runden Lippen, geschrieben w.
        hint: Welches Wort kennst du? Beachte das erste Zeichen.
      - type: language-task
        id: konsonanten-hoeren
        languages: { source: de, target: en }
        task: Höre zu und schreibe jeden Satz ganz auf.
        form: { case: ok, punctuation: ok }
        items:
          - audio: sophie-thinks-about-the-party-tomorrow.mp3
            target: Sophie thinks about the party tomorrow.
            mistakes:
              - answer: Sophie sinks about the party tomorrow.
                message: Sinks heißt „sinkt“. Denken heißt think, mit th am Anfang.
          - audio: amir-waits-for-the-bus-every-morning.mp3
            target: Amir waits for the bus every morning.
            mistakes:
              - answer: Amir vaits for the bus every morning.
                message: Der erste Laut ist /w/, geschrieben w.
          - audio: ellie-has-a-very-good-idea-today.mp3
            target: Ellie has a very good idea today.
            mistakes:
              - answer: Ellie has a wery good idea today.
                message: Der erste Laut in very ist /v/, geschrieben v.
        hint: Der Satz sagt dir, welches Wort gemeint ist. Höre den Satz so oft, wie du willst.
  - type: section
    id: anwenden
    title: Sprich nach
    blocks:
      - type: speaking-task
        id: konsonanten-nachsprechen
        language: en
        task: Höre den Satz und nimm dich auf. Höre dich an und bewerte dich selbst. Die App hört nicht zu.
        items:
          - audio: mother-thinks-the-weather-is-lovely-today.mp3
            text: Mother thinks the weather is lovely today.
          - audio: three-brothers-wait-at-the-window.mp3
            text: Three brothers wait at the window.
          - audio: ellie-drives-the-van-very-carefully.mp3
            text: Ellie drives the van very carefully.
        hint: Achte darauf, wo deine Zunge und deine Lippen liegen.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Sophie sagt noch einmal: „Thank you!“ Diesmal versteht Ellie sie sofort. Amir hält die Hand an den Hals und spricht zwei Wörter. Mr Hill sagt: „Hört genau, wo es summt.“ Das hörst du auf der nächsten Seite."
