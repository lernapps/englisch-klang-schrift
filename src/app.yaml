# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: englisch/aussprache
title: Klang und Schrift
intro: "In der Millbrook School hängt Mr Hill, der Englischlehrer, eine Klangpartitur mit drei Zeilen neben das Klassenzimmer-Poster an die Wand. Sophie (11, aus Deutschland, wohnt bei Mrs Parker), Ellie (11, Mrs Parkers Tochter), Ellies Bruder Peter (9) und Amir (11) hören, sprechen und schreiben damit englische Laute, Endungen, Kurzformen und die Melodie von Sätzen. Du lernst die Lautschrift zu lesen, ähnliche Laute zu unterscheiden, -s und -ed richtig zu sprechen und zu schreiben, Kurzformen zu verwenden und Fragen mit der richtigen Melodie zu sprechen. Ohne Ton geht diese App nicht: Stelle Kopfhörer oder Lautsprecher an."
languages: [de]
scope:
  text: Die App erklärt Kindern im ersten und zweiten Lernjahr, wie englische Wörter klingen und wie man sie schreibt. Die Klangpartitur zeigt in drei Zeilen die Laute (unten, in Lautschrift), die Betonung (Mitte, kommt später) und die Melodie (oben). Gelernt werden die wichtigsten Zeichen der britischen Lautschrift, ähnliche Vokale, die Laute th, w, v und r, stimmhafte und stimmlose Wortenden, stumme Buchstaben, die Aussprache und Schreibung der Endungen -s und -ed, Kurzformen mit Apostroph und die Melodie von Aussagen, Fragen und Aufforderungen. Beispiele stammen aus dem Alltag von Sophie, Ellie, Peter und Amir. Nichts in der App beurteilt, wie jemand spricht; die Kinder vergleichen mit dem Original und bewerten sich selbst.
  out:
    - Die Formen mit -s und -ed selbst (stehen in den Explainern zu den Zeiten und zum Plural)
    - Betonung im Wort und im Satz, Bindungen und schwache Formen
    - Amerikanisches Englisch und andere Varietäten
    - Kommas und die Schreibung gleich klingender Wörter
chapters: [klaenge, endungen, gespraech, richtig-schreiben, betonung-rhythmus-melodie]
