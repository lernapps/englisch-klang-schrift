# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Zwei Wörter, ein Klang
description: "Ellie ruft That's my bag! Du lernst, wie zwei Wörter zu einer Kurzform verschmelzen, wie du sie sprichst und wie du sie mit Apostroph schreibst."
competencies: [kurzformen]
scope: "Die Seite zeigt Kurzformen mit be und not: I'm, you're, it's, they're, don't, isn't. Zwei Wörter verschmelzen, ein Apostroph steht für die fehlenden Buchstaben, und man spricht die Kurzform wie ein Wort mit einer Silbe. Dazu der Unterschied zwischen it's (it is) und its (gehört zu es). Die Kurzformen mit have und will und 's als Besitz (Peter's bag) stehen nicht hier. Nicht hier, weil sie auf anderen Seiten stehen: Betonung und die Melodie der Frage."
blocks:
  - type: section
    id: einstieg
    title: Ellie ruft etwas
    blocks:
      - type: figure
        image: images/szene-kurzformen.svg
        alt: "Im Klassenzimmer ruft Ellie in einer Sprechblase: „That's my bag!“ Neben ihr stehen Amir und Mr Hill."
        caption: "Von links: Amir (Brille), Ellie (roter Pferdeschwanz) ruft etwas, rechts steht Mr Hill (graue Haare)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: "Ellie hat ihre Tasche gefunden und ruft: „That's my bag!“ Sie spricht **that's** wie ein einziges Wort."
      - type: single-choice
        id: kurzformen-start
        text: Für welche zwei Wörter steht that's in Ellies Satz?
        options:
          - text: that is
            correct: true
            info: "Das 's steht hier für is: That's my bag heißt „Das ist meine Tasche“."
          - text: that has
            correct: false
            info: "Das 's kann auch für has stehen, aber „Das hat meine Tasche“ ergibt hier keinen Sinn."
          - text: that was
            correct: false
            info: "Für was gibt es keine Kurzform mit 's. Ellie sagt, was jetzt ist."
        explanation: Das 's steht in diesem Satz für is. Aus zwei Wörtern wird eine Kurzform.
        links:
          - title: Lernlandkarte Englisch · Kurzformen
            url: https://lernapps.net/apps/map/englisch/c/kurzformen/
      - type: text
        text: "**Das kannst du danach:** Du sprichst Kurzformen wie ein Wort und schreibst sie mit Apostroph."
  - type: section
    id: neu
    title: Aus zwei Karten wird eine
    blocks:
      - type: text
        text: "Eine **Kurzform** verschmilzt zwei Wörter. In der Klangpartitur werden aus zwei Karten eine. Ein **Apostroph** (') steht dort, wo Buchstaben fehlen."
      - type: figure
        image: images/partitur-kurzformen.svg
        alt: "Die Klangpartitur mit der unteren Zeile. Eine Karte ʃiː unter she und eine Karte ɪz unter is werden mit Plus und Gleich zu einer Karte ʃiːz unter she's."
        caption: "Zwei Karten werden zu einer: she plus is ergibt she's."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: "Klassenzimmer-Poster · Kurzformen"
        header: [Lang, Kurz, Es fehlt]
        rows:
          - [I am, "I'm", a]
          - [you are, "you're", a]
          - [it is, "it's", i]
          - [they are, "they're", a]
          - [do not, "don't", o]
          - [is not, "isn't", o]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              - **Der Apostroph steht dort, wo Buchstaben fehlen:** do not wird don't, denn das o fehlt.
              - **Man spricht eine Kurzform wie ein Wort** mit einer Silbe, ohne Pause dazwischen.
              - **it's heißt it is. its ohne Apostroph** heißt „sein“ oder „ihr“ und gehört zu einem Ding.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: kurzformen-zuordnen
        text: Welche Kurzform gehört zu welchen zwei Wörtern?
        pairs:
          - left: we are
            right: "we're"
          - left: does not
            right: "doesn't"
          - left: he is
            right: "he's"
          - left: are not
            right: "aren't"
        explanation: Der Apostroph steht jeweils dort, wo ein Buchstabe fehlt.
        links:
          - title: Lernlandkarte Englisch · Kurzformen
            url: https://lernapps.net/apps/map/englisch/c/kurzformen/
      - type: single-choice
        id: kurzformen-satz
        text: Welcher Satz ist richtig?
        options:
          - text: It's raining today.
            correct: true
            info: "It's heißt it is: „Es regnet heute.“"
          - text: Its raining today.
            correct: false
            info: "Its ohne Apostroph heißt „sein“ oder „ihr“. Hier braucht der Satz it is, also it's."
          - text: It raining today.
            correct: false
            info: Es fehlt das Wort is. Mit Kurzform heißt der Satz It's raining.
        explanation: Für „es regnet“ braucht der Satz it is, in der Kurzform it's.
        links:
          - title: Lernlandkarte Englisch · Kurzformen
            url: https://lernapps.net/apps/map/englisch/c/kurzformen/
      - type: language-task
        id: kurzformen-schreiben
        languages: { source: de, target: en }
        task: Schreibe die Kurzform. Wenn es zwei richtige gibt, genügt eine.
        form: { case: ok, punctuation: ok }
        items:
          - cue: we are
            target: we're
            mistakes:
              - answer: were
                message: Were ist ein anderes Wort („waren“). Die Kurzform von we are braucht einen Apostroph.
          - cue: does not
            target: doesn't
            mistakes:
              - answer: doesnt
                message: Der Apostroph fehlt. Er steht dort, wo das o fehlt.
              - answer: does'nt
                message: Der Apostroph steht an der falschen Stelle. Er steht dort, wo das o fehlt.
          - cue: we are not
            target: (we aren't|we're not)
            mistakes:
              - answer: we arent
                message: Der Apostroph fehlt. Er steht dort, wo das o fehlt.
        hint: Welche Buchstaben fallen weg? An dieser Stelle steht der Apostroph.
      - type: language-task
        id: kurzformen-korrektur
        languages: { source: de, target: en }
        task: In jedem Satz ist die Kurzform falsch. Schreibe den Satz richtig.
        form: { case: ok, punctuation: ok }
        items:
          - cue: Its raining today.
            target: It's raining today.
            mistakes:
              - answer: Its raining today.
                message: Noch nicht richtig. Hier braucht der Satz it is, also eine Kurzform mit Apostroph.
          - cue: We dont like tea.
            target: We don't like tea.
            mistakes:
              - answer: We dont like tea.
                message: Noch nicht richtig. Wo fehlt ein Buchstabe? Dort steht der Apostroph.
        hint: Prüfe, ob in der Kurzform der Apostroph fehlt oder an der falschen Stelle steht.
      - type: language-task
        id: kurzformen-hoeren
        languages: { source: de, target: en }
        task: Höre zu und schreibe jeden Satz ganz auf.
        form: { case: ok, punctuation: ok }
        items:
          - audio: wheres-peter-this-morning.mp3
            target: Where's Peter this morning?
            mistakes:
              - answer: Wheres Peter this morning?
                message: Der Apostroph fehlt. Where's heißt where is.
          - audio: whats-in-your-bag-today.mp3
            target: What's in your bag today?
            mistakes:
              - answer: Whats in your bag today?
                message: Der Apostroph fehlt. What's heißt what is.
          - audio: whos-that-girl-with-ellie.mp3
            target: Who's that girl with Ellie?
            mistakes:
              - answer: Whos that girl with Ellie?
                message: Der Apostroph fehlt. Who's heißt who is.
        hint: Höre den Satz so oft, wie du willst. Das erste Wort ist eine Kurzform.
  - type: section
    id: anwenden
    title: Sprich nach
    blocks:
      - type: speaking-task
        id: kurzformen-nachsprechen
        language: en
        task: Höre den Satz und nimm dich auf. Höre dich an und bewerte dich selbst. Die App hört nicht zu.
        items:
          - audio: youre-early-and-im-late-again.mp3
            text: You're early, and I'm late again.
          - audio: we-arent-hungry-at-the-moment.mp3
            text: We aren't hungry at the moment.
          - audio: ellie-doesnt-like-coffee-today.mp3
            text: Ellie doesn't like coffee today.
        hint: Sprich jede Kurzform wie ein Wort, ohne Pause in der Mitte.
  - type: section
    id: weiter
    title: Wie es weitergeht
    blocks:
      - type: text
        text: "Mr Hill sagt: „Wenn ihr sprecht, ändert sich nicht nur das Wort, sondern auch die Stimme. Sie geht rauf oder runter.“ Wie die Stimme bei einer Frage klingt und wie bei einer Aussage, hörst du auf der nächsten Seite."
