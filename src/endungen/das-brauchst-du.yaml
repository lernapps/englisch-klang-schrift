# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du hier
description: Plural, simple past mit -ed, present progressive und simple present noch einmal kurz, bevor Mr Hill die Werkstatt für Endungen hinstellt.
recap: [englisch/plural, englisch/simple-past, englisch/present-progressive, englisch/simple-present]
scope: "Die Seite wiederholt nur vier Bausteine aus anderen Explainern: den Plural der Nomen (-s, -es, unregelmäßig), das simple past mit regelmäßigen Verben (-ed), das present progressive (am, is, are plus -ing) und das simple present (-s bei he, she, it). Neue Inhalte gibt es nicht, auch keine Übung. Wie die Endungen klingen und wie sich die Schreibung davor ändert, kommt auf den nächsten Seiten."
blocks:
  - type: section
    id: einstieg
    title: Das solltest du schon können
    blocks:
      - type: text
        text: "Kannst du das schon? **Ich kann den Plural von Nomen bilden, auch die unregelmäßigen Formen wie children, men und feet.** Das ist der Baustein „Plural der Nomen“. **Ich kann im simple past mit regelmäßigen Verben (-ed) von abgeschlossenen Ereignissen erzählen.** Das ist der Baustein „Simple past: regelmäßige Verben“. **Ich kann im present progressive sagen, was gerade passiert (She is reading.).** Das ist der Baustein „Present progressive“. **Ich kann im simple present über Gewohnheiten und Tatsachen sprechen und das -s bei he, she, it anhängen.** Das ist der Baustein „Simple present“. Alle vier hängen eine Endung an ein Wort. Lies die Tabellen und prüfe in Gedanken, ob du alles kennst."
      - type: table
        caption: Klassenzimmer-Poster · Die Endungen
        header: [Form, Beispiel]
        rows:
          - [Plural mit -s oder -es, "book – books, box – boxes"]
          - [Plural unregelmäßig, "child – children"]
          - [Simple past mit -ed, "walk – walked"]
          - [Present progressive mit -ing, "She is reading."]
          - [Simple present mit -s, "She reads."]
      - type: text
        text: "Nicht sicher? Wiederhole es auf den Seiten der Lernlandkarte: [Plural der Nomen](https://lernapps.net/apps/map/englisch/c/plural/), [Simple past](https://lernapps.net/apps/map/englisch/c/simple-past/), [Present progressive](https://lernapps.net/apps/map/englisch/c/present-progressive/) und [Simple present](https://lernapps.net/apps/map/englisch/c/simple-present/)."
  - type: section
    id: kapitel-eins
    title: Das kennst du aus Kapitel 1
    blocks:
      - type: text
        text: "In der Klangpartitur zeigt jede blaue **Karte** ein Wort in Lautschrift (siehe [Lautschrift lesen](/klaenge/lautschrift/)). Und du hast die Hand an den Hals gelegt: Bei einem **stimmhaften** Laut summt es, bei einem **stimmlosen** nicht (siehe [Wo es am Ende summt](/klaenge/stimmhafte-auslaute/)). Das brauchst du gleich für die Endungen."
  - type: section
    id: weiter
    title: Was jetzt kommt
    blocks:
      - type: text
        text: "Neben der Klangpartitur steht jetzt eine Werkstatt für Wörter: Endungen werden angehängt, und manchmal ändert sich vor einer Endung die Schreibung."
